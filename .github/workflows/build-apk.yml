name: FEHM APK Oluştur

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK 35 kur
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: APK oluştur
        run: |
          cd FEHM-v1.0.0-TAM-EGITIM-SISTEMI
          chmod +x build.sh
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FEHM-v1.0.0-APK
          path: FEHM-v1.0.0-TAM-EGITIM-SISTEMI/output/*.apk
