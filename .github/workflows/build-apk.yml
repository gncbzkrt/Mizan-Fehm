name: FEHM APK Oluştur

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynakları al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK 35 kur
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: FEHM paketini aç
        run: |
          echo "Repo içeriği:"
          ls -la

          ZIP_FILE=$(find . -maxdepth 1 -name "FEHM*.zip" -type f | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: FEHM ZIP dosyası bulunamadı."
            exit 1
          fi

          echo "Bulunan paket: $ZIP_FILE"
          mkdir -p fehm_build
          unzip -q "$ZIP_FILE" -d fehm_build

          echo "ZIP açıldı."
          find fehm_build -maxdepth 3 -type f | sort | head -100

      - name: APK oluştur
        run: |
          BUILD_SCRIPT=$(find fehm_build -name "build.sh" -type f | head -n 1)

          if [ -z "$BUILD_SCRIPT" ]; then
            echo "HATA: ZIP içinde build.sh bulunamadı."
            find fehm_build -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Bulunan build.sh: $BUILD_SCRIPT"

          BUILD_DIR=$(dirname "$BUILD_SCRIPT")
          cd "$BUILD_DIR"

          chmod +x build.sh
          ./build.sh

      - name: APK'yı indirilebilir hale getir
        uses: actions/upload-artifact@v4
        with:
          name: FEHM-v1.0.0-APK
          path: "fehm_build/**/output/*.apk"
          if-no-files-found: error
